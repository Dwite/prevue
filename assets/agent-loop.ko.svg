<?xml version="1.0" encoding="UTF-8"?>
<!-- 에이전트 수정 루프 — 이전(agent-loop-before: 개발자가 고리 안, 주황)과 이후(agent-loop: 개발자가 고리 밖, 파랑)가 같은 고리 모양이라 짝으로 읽힌다.
     뷰어의 톤을 따른다(흰 카드 · 그림자 · 모서리 12, 시스템 폰트). 한국어판(.ko)은 이름(Prevue · Android Studio · claude · codex)을 영어로 둔다.
     tools/readme-shots.mjs loop 가 PNG 로 뽑는다. -->
<svg viewBox="0 0 960 404" width="960" height="404" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="loop-title loop-desc" xml:lang="ko">
  <title id="loop-title">Prevue에서의 UI 수정 루프</title>
  <desc id="loop-desc">개발자가 목표와 기준 이미지를 주면 코딩 에이전트가 고쳐 저장하고, Prevue가 약 1초에 그린 PNG를 prevue wait로 받아 기준과 비교하며 혼자 루프를 돈다. 끝나면 개발자가 브라우저의 같은 Preview로 확인한다.</desc>
  <defs>
    <style>
      .ring { fill: none; stroke-opacity: .10; stroke-width: 28; }
      .t { font-size: 18px !important; } .s { font-size: 14px !important; } .c, .l { font-size: 15px !important; } .b { font-size: 16px !important; }
      .t, .s, .c, .l, .b { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", system-ui, sans-serif !important; }
      .s { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace !important; }
      .warm { fill: none; stroke: #ff6b2c; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
      .ring { fill: none; stroke: #007aff; stroke-opacity: .10; stroke-width: 28; }
      .t { font-size: 18px !important; } .s { font-size: 14px !important; } .c, .l { font-size: 15px !important; } .b { font-size: 16px !important; }
      .t { font: 600 14px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", system-ui, sans-serif; fill: #1d1d1f; letter-spacing: -.01em; }
      .s { font: 400 11.5px ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace; fill: #6e6e73; }
      .l { font: 500 12px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", system-ui, sans-serif; fill: #6e6e73; }
      .c { font: 500 12px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", system-ui, sans-serif; fill: #1d1d1f; }
      .b { font: 600 13px -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", system-ui, sans-serif; fill: #007aff; }
      .card { fill: #fff; stroke: rgba(0, 0, 0, .05); filter: url(#shadow); }
      .chip { fill: #fff; stroke: rgba(0, 0, 0, .06); filter: url(#shadow-s); }
      .tile { fill: rgba(0, 0, 0, .05); }
      .loop { fill: none; stroke: #007aff; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
      .hand { fill: none; stroke: #aeaeb2; stroke-width: 1.5; stroke-linecap: round; }
    </style>
    <!-- 뷰어의 shadow 토큰: 0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.06) -->
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="190%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity=".05"/>
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000" flood-opacity=".06"/>
    </filter>
    <filter id="shadow-s" x="-20%" y="-50%" width="140%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity=".07"/>
    </filter>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1.5 1.5 L9 5 L1.5 8.5 z" fill="#007aff"/>
    </marker>
    <marker id="arrow-hand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1.5 1.5 L9 5 L1.5 8.5 z" fill="#aeaeb2"/>
    </marker>
    <marker id="arrow-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1.5 1.5 L9 5 L1.5 8.5 z" fill="#ff6b2c"/>
    </marker>
  </defs>
